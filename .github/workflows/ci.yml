name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Examples
        run: |
          ./build/examples/basic_monitor
          ./build/examples/api_tour

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          if [ "${{ matrix.sanitizer }}" = "address" ]; then FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="$FLAGS"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  consumer:
    name: Consumed through FetchContent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/consumer -B build-consumer -DCLIENTMONITOR_SOURCE_DIR=$GITHUB_WORKSPACE
      - name: Build
        run: cmake --build build-consumer --parallel
      - name: Run
        run: ./build-consumer/consumer

  bindings:
    # The libwebrtc and libmediasoupclient bindings and examples/mediasoup_client.cpp, compiled
    # against libmediasoupclient and a prebuilt libwebrtc of the milestone it targets. Compile only:
    # see test/bindings/CMakeLists.txt. libwebrtc's headers need clang.
    name: Bindings (libmediasoupclient ${{ matrix.mediasoupclient }}, libwebrtc m140)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mediasoupclient: ["3.5.0", "v3"]
    env:
      LIBWEBRTC_RELEASE: "140.7339.2.0"
    steps:
      - uses: actions/checkout@v4
      - name: Cache libwebrtc
        id: cache-webrtc
        uses: actions/cache@v4
        with:
          path: webrtc
          key: libwebrtc-linux-x64-${{ env.LIBWEBRTC_RELEASE }}
      - name: Download libwebrtc
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          mkdir -p webrtc
          curl -sSfL "https://github.com/crow-misia/libwebrtc-bin/releases/download/${LIBWEBRTC_RELEASE}/libwebrtc-linux-x64.tar.xz" | tar xJ -C webrtc
      - name: Configure
        env:
          CXX: clang++
        run: |
          cmake -S test/bindings -B build-bindings \
            -DCLIENTMONITOR_SOURCE_DIR=$GITHUB_WORKSPACE \
            -DMEDIASOUPCLIENT_GIT_TAG=${{ matrix.mediasoupclient }} \
            -DLIBWEBRTC_INCLUDE_PATH=$GITHUB_WORKSPACE/webrtc/include \
            -DLIBWEBRTC_BINARY_PATH=$GITHUB_WORKSPACE/webrtc/lib
      - name: Build
        run: cmake --build build-bindings --parallel
