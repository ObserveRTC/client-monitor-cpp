name: Release

# Push a vX.Y.Z tag to publish a GitHub release with a source archive under a fixed name, so
# applications can fetch either one version or always the latest:
#   https://github.com/ObserveRTC/client-monitor-cpp/releases/download/vX.Y.Z/client-monitor-cpp.tar.gz
#   https://github.com/ObserveRTC/client-monitor-cpp/releases/latest/download/client-monitor-cpp.tar.gz

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the CMake version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9.]\+\).*/\1/p' CMakeLists.txt | head -n 1)"
          echo "tag ${tag}, CMakeLists.txt ${version}"
          test "${tag}" = "${version}"

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          git archive --format=tar.gz --prefix=client-monitor-cpp/ -o client-monitor-cpp.tar.gz "${GITHUB_REF_NAME}"
          sha256sum client-monitor-cpp.tar.gz > client-monitor-cpp.tar.gz.sha256
          cat client-monitor-cpp.tar.gz.sha256

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME#v}' section"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            client-monitor-cpp.tar.gz client-monitor-cpp.tar.gz.sha256 \
            --title "client-monitor-cpp ${GITHUB_REF_NAME}" \
            --notes-file notes.md
